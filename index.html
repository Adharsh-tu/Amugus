<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Among Us - HTML5 Canvas Prototype</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050811;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
    }
    #canvas-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Mobile Controls */
    .touch-ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }
    .action-btn {
      position: absolute;
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
      transition: transform 0.08s ease, filter 0.15s ease;
      background-size: cover;
    }
    .action-btn:active {
      transform: scale(0.92);
    }
    .action-btn.disabled {
      filter: grayscale(1) opacity(0.4);
      pointer-events: none;
    }

    #btn-kill {
      bottom: 30px;
      right: 30px;
      background: radial-gradient(circle, #ff2a2a, #8b0000);
      border-color: #ff8585;
      display: none;
    }
    #btn-use {
      bottom: 30px;
      right: 120px;
      background: radial-gradient(circle, #3b82f6, #1e3a8a);
      border-color: #93c5fd;
    }
    #btn-report {
      bottom: 120px;
      right: 40px;
      background: radial-gradient(circle, #f59e0b, #b45309);
      border-color: #fde68a;
    }

    /* Cooldown Overlay on Kill */
    #kill-cooldown-svg {
      position: absolute;
      inset: -3px;
      width: 80px;
      height: 80px;
      transform: rotate(-90deg);
      pointer-events: none;
    }
    #kill-cooldown-circle {
      fill: none;
      stroke: rgba(255, 255, 255, 0.9);
      stroke-width: 5;
      stroke-dasharray: 235;
      stroke-dashoffset: 0;
    }

    /* Modal dialogs */
    .overlay-modal {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 16, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }
    .modal-box {
      background: #111827;
      border: 3px solid #374151;
      border-radius: 16px;
      width: 100%;
      max-width: 540px;
      color: #fff;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      position: relative;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      border-bottom: 2px solid #1f2937;
      padding-bottom: 8px;
    }
    .close-btn {
      background: #ef4444;
      border: none;
      color: #fff;
      font-weight: bold;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Task: Wires */
    .wires-board {
      display: flex;
      justify-content: space-between;
      height: 220px;
      position: relative;
      user-select: none;
      margin: 20px 0;
    }
    .wire-col {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      z-index: 2;
    }
    .wire-terminal {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      border: 3px solid #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    #wires-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Task: Download */
    .download-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 0;
    }
    .progress-bar-bg {
      width: 100%;
      height: 30px;
      background: #1f2937;
      border-radius: 15px;
      overflow: hidden;
      border: 2px solid #4b5563;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #34d399);
      transition: width 0.1s linear;
    }

    /* Meeting Panel */
    .meeting-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin: 16px 0;
    }
    .vote-card {
      background: #1f2937;
      border: 2px solid #374151;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .vote-card:hover {
      background: #374151;
      border-color: #60a5fa;
    }
    .vote-card.dead {
      opacity: 0.45;
      filter: grayscale(1);
      cursor: not-allowed;
      border-color: #7f1d1d;
    }
    .vote-card.voted-for {
      border-color: #3b82f6;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }
    .vote-avatar {
      width: 32px;
      height: 40px;
      border-radius: 6px;
    }
    .meeting-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
    }

    /* Fullscreen Cutscene / Role Splash */
    #splash-screen {
      position: absolute;
      inset: 0;
      background: #000;
      z-index: 200;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
      padding: 24px;
      transition: opacity 0.5s ease;
    }
    #splash-title {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    #splash-subtitle {
      font-size: 20px;
      color: #9ca3af;
      margin-bottom: 24px;
      max-width: 460px;
    }
    .start-btn {
      padding: 14px 40px;
      background: #2563eb;
      color: #fff;
      border: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <!-- Touch UI Layer -->
  <div class="touch-ui" id="touchControls">
    <div id="btn-use" class="action-btn disabled">USE</div>
    <div id="btn-report" class="action-btn disabled">REPORT</div>
    <div id="btn-kill" class="action-btn">
      <svg id="kill-cooldown-svg" viewBox="0 0 80 80">
        <circle id="kill-cooldown-circle" cx="40" cy="40" r="37.5"></circle>
      </svg>
      KILL
    </div>
  </div>

  <!-- Mini-Game: Wire Matching Modal -->
  <div class="overlay-modal" id="modal-wires">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="color: #60a5fa;">Fix Electrical Wires</h3>
        <button class="close-btn" onclick="Game.closeMiniGame()">✕</button>
      </div>
      <div class="wires-board" id="wires-container">
        <canvas id="wires-canvas"></canvas>
        <div class="wire-col" id="wires-left"></div>
        <div class="wire-col" id="wires-right"></div>
      </div>
      <p style="text-align:center; font-size: 13px; color:#9ca3af;">Connect matching wire colors from left to right</p>
    </div>
  </div>

  <!-- Mini-Game: Download Data Modal -->
  <div class="overlay-modal" id="modal-download">
    <div class="modal-box">
      <div class="modal-header">
        <h3 style="color: #34d399;">Data Transfer</h3>
        <button class="close-btn" onclick="Game.closeMiniGame()">✕</button>
      </div>
      <div class="download-container">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="download-progress"></div>
        </div>
        <p id="download-status" style="font-family: monospace;">Speed: 0.00 KB/s</p>
        <button class="start-btn" id="download-trigger-btn" onclick="Game.startDownloadTask()">DOWNLOAD</button>
      </div>
    </div>
  </div>

  <!-- Voting / Meeting Modal -->
  <div class="overlay-modal" id="modal-meeting">
    <div class="modal-box" style="max-width: 620px;">
      <div class="modal-header">
        <h2 style="color: #f87171; letter-spacing: 2px;">EMERGENCY MEETING</h2>
        <div id="meeting-timer" style="font-weight: bold; font-size: 20px; color:#fbbf24;">15s</div>
      </div>
      <p style="font-size: 14px; color:#9ca3af; margin-bottom: 8px;">Who is the Impostor? Cast your vote:</p>
      <div class="meeting-grid" id="meeting-roster"></div>
      <div class="meeting-footer">
        <button class="start-btn" style="background: #4b5563; font-size: 14px; padding: 8px 18px;" onclick="Game.castVote(null)">Skip Vote</button>
        <div id="vote-info" style="font-size: 13px; color: #9ca3af;">Select an astronaut</div>
      </div>
    </div>
  </div>

  <!-- Splash / Intro / Win / Loss Screen -->
  <div id="splash-screen">
    <h1 id="splash-title">SPACESHIP ASSIGNED</h1>
    <p id="splash-subtitle">Loading your mission parameters...</p>
    <button class="start-btn" id="splash-btn" onclick="Game.onSplashProceed()">START MISSION</button>
          </div>
    <script>
    /* ==========================================================================
       SYNTHESIZER SOUND ENGINE (Vanilla Web Audio API)
       ========================================================================== */
    class AudioSynth {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playStep() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        const now = this.ctx.currentTime;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(75, now);
        osc.frequency.exponentialRampToValueAtTime(35, now + 0.06);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }
      playKill() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc1 = this.ctx.createOscillator();
        const gain1 = this.ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(140, now);
        osc1.frequency.exponentialRampToValueAtTime(30, now + 0.35);
        gain1.gain.setValueAtTime(0.4, now);
        gain1.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc1.connect(gain1);
        gain1.connect(this.ctx.destination);
        osc1.start(now);
        osc1.stop(now + 0.35);

        const bufferSize = this.ctx.sampleRate * 0.2;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, now);
        const nGain = this.ctx.createGain();
        nGain.gain.setValueAtTime(0.25, now);
        nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
        noise.connect(filter);
        filter.connect(nGain);
        nGain.connect(this.ctx.destination);
        noise.start(now);
      }
      playAlarm() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.linearRampToValueAtTime(880, now + 0.2);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.3);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.3);
      }
      playSuccess() {
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          const start = this.ctx.currentTime + idx * 0.08;
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, start);
          gain.gain.setValueAtTime(0.1, start);
          gain.gain.exponentialRampToValueAtTime(0.001, start + 0.2);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(start);
          osc.stop(start + 0.2);
        });
      }
    }
    const Sound = new AudioSynth();

    /* ==========================================================================
       CONSTANTS & CONFIGURATION
       ========================================================================== */
    const PLAYER_COLORS = [
      { name: 'Red', hex: '#c51111', dark: '#7a0838' },
      { name: 'Blue', hex: '#132ed1', dark: '#09158e' },
      { name: 'Green', hex: '#117f2d', dark: '#0a4d1a' },
      { name: 'Pink', hex: '#ed54ba', dark: '#ab2ca3' },
      { name: 'Orange', hex: '#ef7d0d', dark: '#b04a02' },
      { name: 'Yellow', hex: '#f5f557', dark: '#c2870c' },
      { name: 'Cyan', hex: '#38fedc', dark: '#24a89c' }
    ];

    const MAP_BOUNDS = { width: 2200, height: 1600 };

    const ROOMS = [
      { name: 'Cafeteria', x: 800, y: 150, w: 600, h: 420, color: '#1a2234' },
      { name: 'MedBay', x: 250, y: 300, w: 450, h: 400, color: '#16232e' },

      { x: 420, y: 680, w: 120, h: 250 },

      { x: 1420, y: 980, w: 160, h: 120 }
    ];

    const SOLID_WALLS = [
      { x: 100, y: 80, w: 1980, h: 40 },
      { x: 100, y: 1480, w: 1980, h: 40 },
      { x: 100, y: 80, w: 40, h: 1440 },
      { x: 2040, y: 80, w: 40, h: 1440 },
      { x: 1020, y: 300, w: 160, h: 120 },

    /* ==========================================================================
       PROCEDURAL RENDERING ENGINE
       ========================================================================== */
    class ProceduralGraphics {
      static drawAstronaut(ctx, x, y, size, color, facingLeft, animOffset, isDead = false) {
        ctx.save();
        ctx.translate(x, y);

        if (isDead) {
          this.drawDeadBody(ctx, size, color);
          ctx.restore();
          return;
        }

        if (facingLeft) ctx.scale(-1, 1);

        const bobbing = Math.sin(animOffset * 10) * 2.5;
        ctx.translate(0, bobbing);

        ctx.lineWidth = 4.5;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.strokeStyle = '#0a0d14';

        // Backpack
        ctx.fillStyle = color.dark;
        ctx.beginPath();
        ctx.roundRect(-size * 0.72, -size * 0.35, size * 0.32, size * 0.72, [8]);
        ctx.fill();
        ctx.stroke();

        // Legs
        const legSwing = Math.sin(animOffset * 12) * (size * 0.22);
        ctx.fillStyle = color.dark;
        ctx.beginPath();
        ctx.roundRect(-size * 0.28, size * 0.35 - legSwing, size * 0.24, size * 0.35 + legSwing, [4, 4, 8, 8]);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = color.hex;
        ctx.beginPath();
        ctx.roundRect(size * 0.05, size * 0.35 + legSwing, size * 0.24, size * 0.35 - legSwing, [4, 4, 8, 8]);
        ctx.fill();
        ctx.stroke();

        // Bean Body
        ctx.fillStyle = color.hex;
        ctx.beginPath();
        ctx.ellipse(0, -size * 0.1, size * 0.44, size * 0.62, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.clip();
        ctx.fillStyle = color.dark;
        ctx.beginPath();
        ctx.ellipse(-size * 0.12, size * 0.3, size * 0.44, size * 0.35, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Visor
        const visorX = size * 0.16;
        const visorY = -size * 0.18;
        const visorW = size * 0.34;
        const visorH = size * 0.24;

        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(visorX - 2, visorY - 2, visorW + 4, visorH + 4, [10]);
        ctx.fill();
        ctx.stroke();

        const visorGrad = ctx.createLinearGradient(visorX, visorY, visorX, visorY + visorH);
        visorGrad.addColorStop(0, '#a5f3fc');
        visorGrad.addColorStop(0.5, '#38bdf8');
        visorGrad.addColorStop(1, '#0284c7');
        ctx.fillStyle = visorGrad;
        ctx.beginPath();
        ctx.roundRect(visorX, visorY, visorW, visorH, [8]);
        ctx.fill();

        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        ctx.ellipse(visorX + visorW * 0.45, visorY + visorH * 0.3, visorW * 0.28, visorH * 0.14, -0.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      static drawDeadBody(ctx, size, color) {
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#05070a';

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.roundRect(-4, -size * 0.45, 8, size * 0.4, [4]);
        ctx.fill();
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(-5, -size * 0.42, 6, 0, Math.PI * 2);
        ctx.arc(5, -size * 0.42, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = color.hex;
        ctx.beginPath();
        ctx.arc(0, 0, size * 0.42, 0, Math.PI);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#991b1b';
        ctx.beginPath();
        ctx.ellipse(0, 0, size * 0.42, size * 0.12, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.save();
        ctx.fillStyle = 'rgba(185, 28, 28, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, size * 0.35, size * 0.65, size * 0.25, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
          /* ==========================================================================
       MAIN GAME SYSTEM & STATE MACHINE
       ========================================================================== */
    class GameEngine {
      constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.state = 'MENU';
        this.dpr = window.devicePixelRatio || 1;
        this.viewWidth = 0;
        this.viewHeight = 0;
        this.camera = { x: 1000, y: 350, targetX: 1000, targetY: 350 };
        this.player = null;
        this.bots = [];
        this.corpses = [];
        this.tasks = [];
        this.killCooldown = 0;
        this.KILL_COOLDOWN_MAX = 15.0;
        this.closestTarget = null;
        this.reportableCorpse = null;
        this.stationTasksTotal = 8;
        this.stationTasksCompleted = 0;
        this.currentActiveTask = null;
        this.joystick = {
          active: false,
          pointerId: null,
          startX: 0,
          startY: 0,
          curX: 0,
          curY: 0,
          vectorX: 0,
          vectorY: 0,
          maxRadius: 55
        };
        this.keys = {};
        this.stepTimer = 0;

        this.initCanvasSize();
        this.bindEvents();
        this.initStationTasks();
      }

      initCanvasSize() {
        this.viewWidth = window.innerWidth;
        this.viewHeight = window.innerHeight;
        this.canvas.width = Math.floor(this.viewWidth * this.dpr);
        this.canvas.height = Math.floor(this.viewHeight * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
      }

      bindEvents() {
        window.addEventListener('resize', () => this.initCanvasSize());
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          if (e.code === 'KeyE') this.triggerUseAction();
          if (e.code === 'KeyQ') this.triggerKillAction();
          if (e.code === 'KeyR') this.triggerReportAction();
        });
        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });

        window.addEventListener('pointerdown', (e) => {
          if (e.target.closest('.action-btn') || e.target.closest('.overlay-modal') || e.target.closest('#splash-screen')) return;
          if (e.clientX < this.viewWidth * 0.55 && !this.joystick.active) {
            this.joystick.active = true;
            this.joystick.pointerId = e.pointerId;
            this.joystick.startX = e.clientX;
            this.joystick.startY = e.clientY;
            this.joystick.curX = e.clientX;
            this.joystick.curY = e.clientY;
            this.joystick.vectorX = 0;
            this.joystick.vectorY = 0;
          }
        });

        window.addEventListener('pointermove', (e) => {
          if (this.joystick.active && e.pointerId === this.joystick.pointerId) {
            this.joystick.curX = e.clientX;
            this.joystick.curY = e.clientY;
            const dx = e.clientX - this.joystick.startX;
            const dy = e.clientY - this.joystick.startY;
            const dist = Math.hypot(dx, dy);
            const clampedDist = Math.min(dist, this.joystick.maxRadius);
            const angle = Math.atan2(dy, dx);
            this.joystick.vectorX = (Math.cos(angle) * clampedDist) / this.joystick.maxRadius;
            this.joystick.vectorY = (Math.sin(angle) * clampedDist) / this.joystick.maxRadius;
          }
        });

        const cancelJoy = (e) => {
          if (this.joystick.active && e.pointerId === this.joystick.pointerId) {
            this.joystick.active = false;
            this.joystick.vectorX = 0;
            this.joystick.vectorY = 0;
          }
        };
        window.addEventListener('pointerup', cancelJoy);
        window.addEventListener('pointercancel', cancelJoy);

        document.getElementById('btn-kill').addEventListener('click', () => this.triggerKillAction());
        document.getElementById('btn-use').addEventListener('click', () => this.triggerUseAction());
        document.getElementById('btn-report').addEventListener('click', () => this.triggerReportAction());
      }

      initStationTasks() {
        this.tasks = [
          { id: 'w1', type: 'wires', room: 'Electrical', x: 970, y: 990, radius: 45, completed: false },
          { id: 'w2', type: 'wires', room: 'Cafeteria', x: 1320, y: 200, radius: 45, completed: false },
          { id: 'd1', type: 'download', room: 'Cafeteria', x: 860, y: 220, radius: 45, completed: false },
          { id: 'd2', type: 'download', room: 'Reactor', x: 260, y: 960, radius: 45, completed: false },
          { id: 'w3', type: 'wires', room: 'MedBay', x: 300, y: 360, radius: 45, completed: false },
          { id: 'd3', type: 'download', room: 'Storage', x: 1650, y: 620, radius: 45, completed: false },
          { id: 'w4', type: 'wires', room: 'Reactor', x: 620, y: 1300, radius: 45, completed: false },
          { id: 'd4', type: 'download', room: 'Electrical', x: 1380, y: 1340, radius: 45, completed: false }

        };

      onSplashProceed() {
        const splash = document.getElementById('splash-screen');
        splash.style.opacity = '0';

          this.state = 'PLAYING';

      getRandomStationPosition() {
        const r = ROOMS[Math.floor(Math.random() * ROOMS.length)];
        return {
          x: r.x + 60 + Math.random() * (r.w - 120),
          y: r.y + 60 + Math.random() * (r.h - 120)
        };
      }

      checkCollision(newX, newY, radius = 20) {
        if (newX - radius < 120 || newX + radius > 2020 || newY - radius < 100 || newY + radius > 1460) return true;

        let insideWalkable = false;
        for (const room of ROOMS) {
          if (newX >= room.x && newX <= room.x + room.w && newY >= room.y && newY <= room.y + room.h) {
            insideWalkable = true;
            break;
          }
        }
        if (!insideWalkable) {
          for (const hall of HALLWAYS) {
            if (newX >= hall.x && newX <= hall.x + hall.w && newY >= hall.y && newY <= hall.y + hall.h) {
              insideWalkable = true;
              break;
            }
          }
        }
        if (!insideWalkable) return true;

        for (const wall of SOLID_WALLS) {
          if (
            newX + radius > wall.x &&
            newX - radius < wall.x + wall.w &&
            newY + radius > wall.y &&
            newY - radius < wall.y + wall.h
          ) {
            return true;
          }
        }
        return false;
      }

      updateBots(dt) {
        for (const bot of this.bots) {
          if (bot.isDead) continue;

          if (bot.state === 'ROAMING') {
            const dx = bot.targetNode.x - bot.x;
            const dy = bot.targetNode.y - bot.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 20) {
              bot.state = 'WORKING';
              bot.taskCooldown = 3.5 + Math.random() * 4.0;
            } else {
              const moveX = (dx / dist) * bot.speed;
              const moveY = (dy / dist) * bot.speed;

              if (!this.checkCollision(bot.x + moveX, bot.y, bot.size * 0.4)) bot.x += moveX;
              if (!this.checkCollision(bot.x, bot.y + moveY, bot.size * 0.4)) bot.y += moveY;

              bot.facingLeft = moveX < 0;
              bot.walkAnim += dt * 1.6;
            }
          } else if (bot.state === 'WORKING') {
            bot.taskCooldown -= dt;
            if (bot.taskCooldown <= 0) {
              bot.targetNode = this.getRandomStationPosition();
              bot.state = 'ROAMING';
            }
          }

          for (const corpse of this.corpses) {
            if (Math.hypot(corpse.x - bot.x, corpse.y - bot.y) < 140) {
              this.triggerMeeting('Dead body discovered by ' + bot.name);
              return;
            }
          }
        }
      }

      updatePlayer(dt) {
        if (this.player.isDead) return;

        let inputX = 0;
        let inputY = 0;

        if (this.keys['KeyW'] || this.keys['ArrowUp']) inputY -= 1;
        if (this.keys['KeyS'] || this.keys['ArrowDown']) inputY += 1;
        if (this.keys['KeyA'] || this.keys['ArrowLeft']) inputX -= 1;
        if (this.keys['KeyD'] || this.keys['ArrowRight']) inputX += 1;

        if (this.joystick.active) {
          inputX = this.joystick.vectorX;
          inputY = this.joystick.vectorY;
        }

        const length = Math.hypot(inputX, inputY);
        if (length > 0.05) {
          const normX = (inputX / (length > 1 ? length : 1)) * this.player.speed;
          const normY = (inputY / (length > 1 ? length : 1)) * this.player.speed;

          if (!this.checkCollision(this.player.x + normX, this.player.y, this.player.size * 0.4)) {
            this.player.x += normX;
          }
          if (!this.checkCollision(this.player.x, this.player.y + normY, this.player.size * 0.4)) {
            this.player.y += normY;
          }

          this.player.facingLeft = normX < 0;
          this.player.walkAnim += dt * 2.2;
          this.player.isMoving = true;

          this.stepTimer -= dt;
          if (this.stepTimer <= 0) {
            Sound.playStep();
            this.stepTimer = 0.32;
          }
        } else {
          this.player.isMoving = false;
        }

        this.camera.targetX = this.player.x;
        this.camera.targetY = this.player.y;
        this.camera.x += (this.camera.targetX - this.camera.x) * 0.1;
        this.camera.y += (this.camera.targetY - this.camera.y) * 0.1;

        if (this.player.isImpostor) {
          if (this.killCooldown > 0) {
            this.killCooldown = Math.max(0, this.killCooldown - dt);
          }
          this.updateKillButtonUI();
        }

        this.updateInteractiveTriggers();
      }

      updateKillButtonUI() {
        const killBtn = document.getElementById('btn-kill');
        const circle = document.getElementById('kill-cooldown-circle');

        let nearestBot = null;
        let minDist = 110;
        for (const bot of this.bots) {
          if (bot.isDead) continue;
          const d = Math.hypot(bot.x - this.player.x, bot.y - this.player.y);
          if (d < minDist) {
            minDist = d;
            nearestBot = bot;
          }
        }
        this.closestTarget = nearestBot;

        const circumference = 235;
        const progress = this.killCooldown / this.KILL_COOLDOWN_MAX;
        circle.style.strokeDashoffset = (circumference * (1 - progress)).toString();

        if (this.killCooldown <= 0 && this.closestTarget) {
          killBtn.classList.remove('disabled');
        } else {
          killBtn.classList.add('disabled');
        }
      }

      updateInteractiveTriggers() {
        const useBtn = document.getElementById('btn-use');
        const reportBtn = document.getElementById('btn-report');

        let nearTask = null;
        if (!this.player.isImpostor) {
          for (const t of this.tasks) {
            if (!t.completed && Math.hypot(t.x - this.player.x, t.y - this.player.y) < t.radius + 20) {
              nearTask = t;
              break;
            }
          }
        }
        this.currentNearTask = nearTask;
        if (nearTask) {
          useBtn.classList.remove('disabled');
        } else {
          useBtn.classList.add('disabled');
        }

        let foundCorpse = null;
        for (const corpse of this.corpses) {
          if (Math.hypot(corpse.x - this.player.x, corpse.y - this.player.y) < 140) {
            foundCorpse = corpse;
            break;
          }
        }
        this.reportableCorpse = foundCorpse;
        if (foundCorpse) {
          reportBtn.classList.remove('disabled');
        } else {
          reportBtn.classList.add('disabled');
        }
      }

      triggerKillAction() {
        if (!this.player.isImpostor || this.killCooldown > 0 || !this.closestTarget) return;

        Sound.playKill();
        this.closestTarget.isDead = true;

        this.corpses.push({
          id: this.closestTarget.id,
          name: this.closestTarget.name,
          color: this.closestTarget.color,
          x: this.closestTarget.x,
          y: this.closestTarget.y
        });

        this.player.x = this.closestTarget.x;
        this.player.y = this.closestTarget.y;

        this.killCooldown = this.KILL_COOLDOWN_MAX;
        this.closestTarget = null;

        this.checkWinLossConditions();
      }

      triggerReportAction() {
        if (!this.reportableCorpse) return;
        this.triggerMeeting('Reported by ' + this.player.name);
      }

      triggerUseAction() {
        if (!this.currentNearTask) return;
        this.openMiniGame(this.currentNearTask);
      }

      openMiniGame(task) {
        this.state = 'MINIGAME';
        this.currentActiveTask = task;

        if (task.type === 'wires') {
          this.initWireMiniGame();
        } else if (task.type === 'download') {
          this.initDownloadMiniGame();
        }
      }

      closeMiniGame() {
        document.getElementById('modal-wires').style.display = 'none';
        document.getElementById('modal-download').style.display = 'none';
        this.state = 'PLAYING';
      }

      initWireMiniGame() {
        const modal = document.getElementById('modal-wires');
        modal.style.display = 'flex';

        const leftCol = document.getElementById('wires-left');
        const rightCol = document.getElementById('wires-right');
        const canvas = document.getElementById('wires-canvas');
        const ctx = canvas.getContext('2d');

        leftCol.innerHTML = '';
        rightCol.innerHTML = '';

        const colors = ['#ef4444', '#3b82f6', '#eab308', '#ec4899'];
        const leftOrder = [...colors].sort(() => Math.random() - 0.5);
        const rightOrder = [...colors].sort(() => Math.random() - 0.5);

        const connections = {};
        let draggingWire = null;

        canvas.width = canvas.parentElement.clientWidth;
        canvas.height = canvas.parentElement.clientHeight;

        leftOrder.forEach((color, idx) => {
          const t = document.createElement('div');
          t.className = 'wire-terminal';
          t.style.backgroundColor = color;
          t.dataset.color = color;
          t.dataset.index = idx;
          leftCol.appendChild(t);

          t.addEventListener('pointerdown', (e) => {
            draggingWire = {
              color,
              startIndex: idx,
              startX: t.offsetLeft + t.offsetWidth,
              startY: t.offsetTop + t.offsetHeight / 2,
              curX: e.clientX - canvas.getBoundingClientRect().left,
              curY: e.clientY - canvas.getBoundingClientRect().top
            };
          });
        });

        rightOrder.forEach((color, idx) => {
          const t = document.createElement('div');
          t.className = 'wire-terminal';
          t.style.backgroundColor = color;
          t.dataset.color = color;
          t.dataset.index = idx;
          rightCol.appendChild(t);
        });

        const redrawWires = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (const [lIdx, rIdx] of Object.entries(connections)) {
            const lTerm = leftCol.children[lIdx];
            const rTerm = rightCol.children[rIdx];
            ctx.strokeStyle = lTerm.dataset.color;
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(lTerm.offsetLeft + lTerm.offsetWidth, lTerm.offsetTop + lTerm.offsetHeight / 2);
            ctx.lineTo(rTerm.offsetLeft, rTerm.offsetTop + rTerm.offsetHeight / 2);
            ctx.stroke();
          }

          if (draggingWire) {
            ctx.strokeStyle = draggingWire.color;
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(draggingWire.startX, draggingWire.startY);
            ctx.lineTo(draggingWire.curX, draggingWire.curY);
            ctx.stroke();
          }
        };

        const onMove = (e) => {
          if (!draggingWire) return;
          draggingWire.curX = e.clientX - canvas.getBoundingClientRect().left;
          draggingWire.curY = e.clientY - canvas.getBoundingClientRect().top;
          redrawWires();
        };

        const onEnd = (e) => {
          if (!draggingWire) return;
          const rect = canvas.getBoundingClientRect();
          const dropX = e.clientX - rect.left;
          const dropY = e.clientY - rect.top;

          for (let i = 0; i < rightCol.children.length; i++) {
            const rTerm = rightCol.children[i];
            const rX = rTerm.offsetLeft;
            const rY = rTerm.offsetTop;
            if (
              dropX >= rX - 30 &&
              dropX <= rX + rTerm.offsetWidth + 30 &&
              dropY >= rY - 10 &&
              dropY <= rY + rTerm.offsetHeight + 10
            ) {
              if (rTerm.dataset.color === draggingWire.color) {
                connections[draggingWire.startIndex] = i;
                Sound.playStep();
              }
              break;
            }
          }

          draggingWire = null;
          redrawWires();

          if (Object.keys(connections).length === 4) {
            Sound.playSuccess();
            setTimeout(() => {
              this.completeTask(this.currentActiveTask);
              this.closeMiniGame();
            }, 400);
          }
        };

        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onEnd);
        redrawWires();
      }

            initDownloadMiniGame() {
        const modal = document.getElementById('modal-download');
        modal.style.display = 'flex';
        const fill = document.getElementById('download-progress');
        const txt = document.getElementById('download-status');
        const btn = document.getElementById('download-trigger-btn');
        fill.style.width = '0%';
        txt.textContent = 'Estimated time: 3 seconds';
        btn.style.display = 'block';
      }

      startDownloadTask() {
        const fill = document.getElementById('download-progress');
        const txt = document.getElementById('download-status');
        const btn = document.getElementById('download-trigger-btn');
        btn.style.display = 'none';

        let p = 0;
        const iv = setInterval(() => {
          p += 2.5;
          fill.style.width = p + '%';
          txt.textContent = 'Downloading data... ' + Math.floor(p) + '%';

          if (p >= 100) {
            clearInterval(iv);
            txt.textContent = 'Download Complete!';
            Sound.playSuccess();
            setTimeout(() => {
              this.completeTask(this.currentActiveTask);
              this.closeMiniGame();
            }, 600);
          }
        }, 60);
      }

      completeTask(task) {
        if (!task || task.completed) return;
        task.completed = true;
        this.stationTasksCompleted++;
        this.checkWinLossConditions();
      }

      triggerMeeting(reason) {
        if (this.state === 'MEETING') return;
        this.state = 'MEETING';
        Sound.playAlarm();

        const modal = document.getElementById('modal-meeting');
        modal.style.display = 'flex';

        const roster = document.getElementById('meeting-roster');
        roster.innerHTML = '';

        const allAstronauts = [this.player, ...this.bots];
        let votedTargetId = null;

        allAstronauts.forEach((ast) => {
          const card = document.createElement('div');
          card.className = 'vote-card' + (ast.isDead ? ' dead' : '');

          const canvasMini = document.createElement('canvas');
          canvasMini.className = 'vote-avatar';
          canvasMini.width = 40;
          canvasMini.height = 45;
          const mCtx = canvasMini.getContext('2d');
          ProceduralGraphics.drawAstronaut(mCtx, 20, 26, 18, ast.color, false, 0, ast.isDead);

          const label = document.createElement('div');
          label.innerHTML = `<strong>${ast.name}</strong><br><small>${ast.isDead ? 'DEAD' : 'ALIVE'}</small>`;

          card.appendChild(canvasMini);
          card.appendChild(label);

          if (!ast.isDead) {
            card.onclick = () => {
              document.querySelectorAll('.vote-card').forEach((c) => c.classList.remove('voted-for'));
              card.classList.add('voted-for');
              votedTargetId = ast.id;
              document.getElementById('vote-info').textContent = `Voted for ${ast.name}`;
            };
          }

          roster.appendChild(card);
        });

        let countdown = 15;
        const timerEl = document.getElementById('meeting-timer');
        timerEl.textContent = countdown + 's';

        const interval = setInterval(() => {
          countdown--;
          timerEl.textContent = countdown + 's';
          if (countdown <= 0) {
            clearInterval(interval);
            this.concludeMeeting(votedTargetId);
          }
        }, 1000);

        this.currentMeetingInterval = interval;
      }

      castVote(targetId) {
        if (this.currentMeetingInterval) clearInterval(this.currentMeetingInterval);
        this.concludeMeeting(targetId);
      }

      concludeMeeting(playerTargetId) {
        document.getElementById('modal-meeting').style.display = 'none';

        const aliveBots = this.bots.filter((b) => !b.isDead);
        const aliveCrew = [this.player, ...aliveBots].filter((a) => !a.isDead);

        const votes = {};
        if (playerTargetId !== null) votes[playerTargetId] = 1;

        aliveBots.forEach((b) => {
          if (Math.random() < 0.75) {
            const randomTarget = aliveCrew[Math.floor(Math.random() * aliveCrew.length)];
            votes[randomTarget.id] = (votes[randomTarget.id] || 0) + 1;
          }
        });

        let maxVotes = 0;
        let ejectedId = null;
        for (const [id, count] of Object.entries(votes)) {
          if (count > maxVotes) {
            maxVotes = count;
            ejectedId = parseInt(id);
          }
        }

        const ejected = [this.player, ...this.bots].find((a) => a.id === ejectedId);
        this.showEjectionScreen(ejected);
      }

      showEjectionScreen(ejected) {
        const splash = document.getElementById('splash-screen');
        const sTitle = document.getElementById('splash-title');
        const sSub = document.getElementById('splash-subtitle');
        const sBtn = document.getElementById('splash-btn');

        splash.style.display = 'flex';
        splash.style.opacity = '1';

        if (ejected) {
          ejected.isDead = true;
          sTitle.textContent = `${ejected.name} WAS EJECTED`;
          sTitle.style.color = '#f59e0b';
          sSub.textContent = ejected.isImpostor
            ? `${ejected.name} was The Impostor.`
            : `${ejected.name} was not The Impostor.`;
        } else {
          sTitle.textContent = 'NO ONE WAS EJECTED';
          sTitle.style.color = '#9ca3af';
          sSub.textContent = 'Tie or vote skipped. The mission continues...';
        }

        sBtn.textContent = 'CONTINUE';
        sBtn.onclick = () => {
          splash.style.opacity = '0';
          setTimeout(() => {
            splash.style.display = 'none';
            this.state = 'PLAYING';
            this.checkWinLossConditions();
          }, 300);
        };
      }

      checkWinLossConditions() {
        const aliveBots = this.bots.filter((b) => !b.isDead);
        const impostorAlive = this.player.isImpostor ? !this.player.isDead : false;
        const totalAliveCrewmates = (this.player.isImpostor ? 0 : (this.player.isDead ? 0 : 1)) + aliveBots.length;

        if (impostorAlive && totalAliveCrewmates <= 1) {
          this.endGame(true, 'IMPOSTOR WINS', 'The Impostor wiped out the ship crew!');
          return;
        }

        if (this.stationTasksCompleted >= this.stationTasksTotal) {
          this.endGame(!this.player.isImpostor, 'CREWMATES WIN', 'All station maintenance tasks have been completed!');
          return;
        }

        if (this.player.isImpostor && this.player.isDead) {
          this.endGame(false, 'DEFEAT', 'You were discovered and ejected into deep space.');
          return;
        }
      }

      endGame(isPlayerWin, title, desc) {
        this.state = 'GAMEOVER';
        const splash = document.getElementById('splash-screen');
        const sTitle = document.getElementById('splash-title');
        const sSub = document.getElementById('splash-subtitle');
        const sBtn = document.getElementById('splash-btn');

        splash.style.display = 'flex';
        splash.style.opacity = '1';

        sTitle.textContent = title;
        sTitle.style.color = isPlayerWin ? '#10b981' : '#ef4444';
        sSub.textContent = desc;

        sBtn.textContent = 'PLAY AGAIN';
        sBtn.onclick = () => {
          this.startMatch();
        };
      }

      render() {
        this.ctx.clearRect(0, 0, this.viewWidth, this.viewHeight);

        this.ctx.save();
        this.ctx.translate(
          Math.floor(this.viewWidth / 2 - this.camera.x),
          Math.floor(this.viewHeight / 2 - this.camera.y)
        );

        this.drawStationMap();
        this.drawStationTasks();

        for (const corpse of this.corpses) {
          ProceduralGraphics.drawAstronaut(this.ctx, corpse.x, corpse.y, 32, corpse.color, false, 0, true);
        }

        const renderList = [...this.bots.filter((b) => !b.isDead)];
        if (!this.player.isDead) renderList.push(this.player);
        renderList.sort((a, b) => a.y - b.y);

        for (const ent of renderList) {
          ProceduralGraphics.drawAstronaut(
            this.ctx,
            ent.x,
            ent.y,
            ent.size,
            ent.color,
            ent.facingLeft,
            ent.walkAnim,
            false
          );

          this.ctx.fillStyle = '#ffffff';
          this.ctx.font = 'bold 12px -apple-system, sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText(ent.name, ent.x, ent.y - ent.size * 0.9);
        }

        this.ctx.restore();

        this.drawVignetteLighting();
        this.drawHUD();

        if (this.joystick.active) {
          this.drawTouchJoystick();
        }
      }

      drawStationMap() {
        this.ctx.strokeStyle = '#1e293b';
        this.ctx.lineWidth = 1;
        const gridSize = 80;
        for (let x = 0; x <= MAP_BOUNDS.width; x += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(x, 0);
          this.ctx.lineTo(x, MAP_BOUNDS.height);
          this.ctx.stroke();
        }
        for (let y = 0; y <= MAP_BOUNDS.height; y += gridSize) {
          this.ctx.beginPath();
          this.ctx.moveTo(0, y);
          this.ctx.lineTo(MAP_BOUNDS.width, y);
          this.ctx.stroke();
        }

        this.ctx.fillStyle = '#0f172a';
        for (const h of HALLWAYS) {
          this.ctx.fillRect(h.x, h.y, h.w, h.h);
          this.ctx.strokeStyle = '#334155';
          this.ctx.lineWidth = 4;
          this.ctx.strokeRect(h.x, h.y, h.w, h.h);
        }

        for (const r of ROOMS) {
          this.ctx.fillStyle = r.color;
          this.ctx.fillRect(r.x, r.y, r.w, r.h);
          this.ctx.strokeStyle = '#475569';
          this.ctx.lineWidth = 6;
          this.ctx.strokeRect(r.x, r.y, r.w, r.h);

          this.ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
          this.ctx.font = '900 32px sans-serif';
          this.ctx.textAlign = 'center';
          this.ctx.fillText(r.name.toUpperCase(), r.x + r.w / 2, r.y + r.h / 2);
        }

        for (const wall of SOLID_WALLS) {
          this.ctx.fillStyle = '#1e293b';
          this.ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
          this.ctx.strokeStyle = '#64748b';
          this.ctx.lineWidth = 3;
          this.ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
        }
      }

      drawStationTasks() {
        for (const task of this.tasks) {
          this.ctx.save();
          this.ctx.translate(task.x, task.y);

          if (!task.completed) {
            const pulse = (Math.sin(Date.now() / 250) + 1) / 2;
            this.ctx.fillStyle = task.type === 'wires' ? `rgba(239, 68, 68, ${0.2 + pulse * 0.3})` : `rgba(16, 185, 129, ${0.2 + pulse * 0.3})`;
            this.ctx.beginPath();
            this.ctx.arc(0, 0, task.radius + 6 * pulse, 0, Math.PI * 2);
            this.ctx.fill();
          }

          this.ctx.fillStyle = task.completed ? '#10b981' : '#3b82f6';
          this.ctx.beginPath();
          this.ctx.roundRect(-16, -16, 32, 32, [6]);
          this.ctx.fill();
          this.ctx.strokeStyle = '#fff';
          this.ctx.lineWidth = 2.5;
          this.ctx.stroke();

          this.ctx.fillStyle = '#0f172a';
          this.ctx.fillRect(-10, -10, 20, 14);

          this.ctx.fillStyle = task.completed ? '#4ade80' : '#facc15';
          this.ctx.beginPath();
          this.ctx.arc(0, 9, 3, 0, Math.PI * 2);
          this.ctx.fill();

          this.ctx.restore();
        }
      }

      drawVignetteLighting() {
        const cx = this.viewWidth / 2;
        const cy = this.viewHeight / 2;
        const maxDist = Math.max(this.viewWidth, this.viewHeight) * 0.7;

        const radial = this.ctx.createRadialGradient(cx, cy, 100, cx, cy, maxDist);
        radial.addColorStop(0, 'rgba(0, 0, 0, 0)');
        radial.addColorStop(0.7, 'rgba(3, 7, 18, 0.45)');
        radial.addColorStop(1, 'rgba(2, 4, 10, 0.9)');

        this.ctx.fillStyle = radial;
        this.ctx.fillRect(0, 0, this.viewWidth, this.viewHeight);
      }

      drawHUD() {
        const hudX = 20;
        const hudY = 20;
        const hudW = Math.min(320, this.viewWidth - 40);
        const hudH = 22;

        this.ctx.fillStyle = '#111827';
        this.ctx.beginPath();
        this.ctx.roundRect(hudX, hudY, hudW, hudH, [6]);
        this.ctx.fill();
        this.ctx.strokeStyle = '#374151';
        this.ctx.lineWidth = 2;
        this.ctx.stroke();

        const progressPercent = this.stationTasksCompleted / this.stationTasksTotal;
        this.ctx.fillStyle = '#22c55e';
        this.ctx.beginPath();
        this.ctx.roundRect(hudX + 2, hudY + 2, (hudW - 4) * progressPercent, hudH - 4, [4]);
        this.ctx.fill();

        this.ctx.fillStyle = '#ffffff';
        this.ctx.font = 'bold 12px sans-serif';
        this.ctx.textAlign = 'left';
        this.ctx.fillText(
          `TOTAL TASKS COMPLETED: ${this.stationTasksCompleted} / ${this.stationTasksTotal}`,
          hudX,
          hudY + 38
        );

        this.ctx.textAlign = 'right';
        this.ctx.font = 'bold 14px sans-serif';
        if (this.player.isImpostor) {
          this.ctx.fillStyle = '#ef4444';
          this.ctx.fillText('ROLE: IMPOSTOR', this.viewWidth - 20, 36);
        } else {
          this.ctx.fillStyle = '#38bdf8';
          this.ctx.fillText('ROLE: CREWMATE', this.viewWidth - 20, 36);
        }
      }

      drawTouchJoystick() {
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
        this.ctx.lineWidth = 3;
        this.ctx.beginPath();
        this.ctx.arc(this.joystick.startX, this.joystick.startY, this.joystick.maxRadius, 0, Math.PI * 2);
        this.ctx.fill();
        this.ctx.stroke();

        const knobX = this.joystick.startX + this.joystick.vectorX * this.joystick.maxRadius;
        const knobY = this.joystick.startY + this.joystick.vectorY * this.joystick.maxRadius;
        this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
        this.ctx.beginPath();
        this.ctx.arc(knobX, knobY, 26, 0, Math.PI * 2);
        this.ctx.fill();
      }

      tick(timestamp) {
        if (!this.lastTime) this.lastTime = timestamp;
        const dt = Math.min((timestamp - this.lastTime) / 1000, 0.1);
        this.lastTime = timestamp;

        if (this.state === 'PLAYING') {
          this.updatePlayer(dt);
          this.updateBots(dt);
        }

        this.render();
        requestAnimationFrame((t) => this.tick(t));
      }
    }

    const Game = new GameEngine();
    window.onload = () => {
      Game.startMatch();
      requestAnimationFrame((t) => Game.tick(t));
    };
  </script>
</body>
